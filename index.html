<div id="loading">住まいを立体にしています…</div><header><small>3D HOUSE EXPLORER</small><h1>住まいを歩く</h1><p>片流れ屋根の平屋 · 約10.01 × 8.65 m</p></header><div class="north" id="compass">↑ 北</div><button id="shareQuick" class="quickShare">LINEで共有</button><button id="togglePanel" aria-controls="panel" aria-expanded="true">メニュー</button>
<aside class="panel" id="panel"><details id="editor"><summary>＋ 別の家を作る・編集</summary><form id="designForm"><p class="note">平屋の概略イメージを作成します。PDF自動変換や設計図作成には対応していません。</p><label>家の名前<input id="designName" value="新しい家" maxlength="40"></label><div class="grid"><label>幅 m<input id="houseWidth" type="number" min="7" max="18" step=".1" value="10" required></label><label>奥行 m<input id="houseDepth" type="number" min="7" max="16" step=".1" value="9" required></label></div><label>天井高 m<input id="houseHeight" type="number" min="2.2" max="3.5" step=".1" value="2.6" required></label><div class="grid"><label>間取り<select id="bedrooms"><option value="1">1LDK</option><option value="2" selected>2LDK</option><option value="3">3LDK</option></select></label><label>個室の位置<select id="roomSide"><option value="north">北側</option><option value="south">南側</option></select></label></div><label>個室エリアの奥行き割合<input id="roomRatio" type="range" min=".35" max=".55" step=".01" value=".45"></label><label>屋根<select id="roofType"><option value="shed">片流れ</option><option value="flat">陸屋根</option></select></label><div class="grid"><label>外壁<input id="wallColor" type="color" value="#78815b"></label><label>屋根色<input id="roofColor" type="color" value="#b97d50"></label></div><button type="submit" class="download">この条件で3Dを作る</button></form><p id="designState" role="status">現在は元の服部邸を表示しています。</p><div class="grid"><button id="undoDesign" disabled>↶ 元に戻す</button><button id="redoDesign" disabled>↷ やり直す</button></div><div id="areaSummary"></div><div class="grid section"><button id="saveDesign" disabled>端末に保存</button><button id="loadDesign">保存案を開く</button><button id="exportDesign" disabled>モデルを書き出す</button><label class="fileButton">モデルを読込<input id="importDesign" type="file" accept=".json,application/json"></label></div><button id="originalHouse" class="download">元の服部邸に戻る</button></details>
<label class="speed">歩く速さ <output id="walkSpeedValue" for="walkSpeed">1.6 m/秒</output><input id="walkSpeed" type="range" min=".6" max="3" step=".2" value="1.6"></label>
<div class="caption">VIEW MODE</div><div class="modes"><button data-mode="outside" class="active">外観</button><button data-mode="cut">間取り</button><button data-mode="inside">室内</button></div><div class="section"><div class="caption">外から見る</div><div class="grid"><button data-view="sw">玄関・南側</button><button data-view="se">南・東側</button><button data-view="ne">東・北側</button><button data-view="nw">北・玄関側</button></div></div><div class="section"><div class="caption">部屋へ移動</div><div class="grid room"><button data-room="living">LDK · 19.5帖</button><button data-room="kitchen">キッチン</button><button data-room="sun">サンルーム</button><button data-room="entry">玄関・廊下</button><button data-room="bed1">洋室① · 6帖</button><button data-room="bed2">洋室② · 6帖</button><button data-room="wash">洗面脱衣室</button><button data-room="bath">浴室</button><button data-room="toilet">トイレ</button></div></div><div class="line"></div><div class="grid"><button id="reset">最初の視点</button><button id="shot">画像を保存</button></div><button id="share" class="download">家族にURLを送る</button><div class="badge" id="location">南西からの外観</div><p id="modelNote" class="note">提供図面をもとにした簡易3Dモデルです。家具・質感・細部はイメージ。屋根色は立面図のオレンジを採用しています。</p></aside>
<div id="joystick" aria-label="移動スティック"><div id="joyKnob"></div><span>歩く</span></div><div id="lookControls"><button id="turnAround" aria-label="180度振り向く">↶ 180°振り向く</button><div id="lookJoystick" aria-label="視点スティック：左右に回転、上下に見回す"><div id="lookKnob"></div><span>見回す</span></div></div><div id="movePad"><span></span><button data-key="w" aria-label="前に歩く">↑</button><span></span><button data-key="a" aria-label="左に歩く">←</button><button data-key="s" aria-label="後ろに歩く">↓</button><button data-key="d" aria-label="右に歩く">→</button></div><div class="foot"><div class="help"><strong id="helpTitle">家をぐるっと見渡す</strong><span id="helpText">左ドラッグ：回転 ／ ホイール：拡大・縮小 ／ 右ドラッグ：平行移動</span></div><div class="status" id="status">EXTERIOR · 外観</div></div><div id="toast" role="status" aria-live="polite"></div><div id="error"></div>
